[tool.pytest.ini_options]
testpaths = [
    "skills/slack-gif-creator/tests",
    "skills/sentiment-analysis/tests",
    "skills/mcp-builder/tests",
    "skills/docx/tests",
    "skills/skill-creator/tests",
    "skills/pptx/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["skills"]
omit = ["*/tests/*", "*/templates/*"]

[tool.coverage.report]
show_missing = true
